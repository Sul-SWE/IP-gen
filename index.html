<!doctype html><html lang="en" translate="no" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="google" content="notranslate"><meta name="theme-color" content="#124a2d"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"><title>IP Generator and Tracker</title><link rel="stylesheet" href="css/style.css"></head><body><main><h1>IP Addresses Auto-Generator Platform</h1>
<div class="tiles"><a class="tile" href="generate.html"><b>IP Generation</b><span>Create the IPs for a new facility. Duplicates are blocked before saving.</span></a><a class="tile" href="management.html"><b>IP Management</b><span>Search, modify, delete and restore records.</span></a><a class="tile" href="worksheet.html"><b>Worksheet</b><span>See the full table. Export or import Excel.</span></a></div>
<div id="dash"><div class="panel empty">Loading...</div></div></main><script src="js/config.js"></script><script src="js/engine.js"></script><script src="js/storage.js"></script><script src="js/common.js"></script>
<script>
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],COL=['#1e7145','#84bd00','#9db7a8'];
function countUp(el){var n=+el.dataset.n,sfx=el.dataset.s||'';if(n<2||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))return;var t0=null;(function f(t){t0=t0||t;var p=Math.min(1,(t-t0)/500);el.textContent=Math.round(n*p)+sfx;if(p<1)requestAnimationFrame(f)})(performance.now())}
function chip(a){return'<span class="chip '+(/^(Created|Restored|Imported)/.test(a)?'g':/^Deleted/.test(a)?'r':'')+'">'+esc(a)+'</span>'}
init('index').then(function(){
  var act=S.records.filter(function(r){return!r.del}),trash=S.records.length-act.length,used=0,tot=0,near=[],rows='';
  Object.keys(CFG.gcps).forEach(function(g){CFG.vendors.forEach(function(v){var u=usage(g,v,S.records),r=u.used/u.max,c=u.used>=u.max?'full':r>=CFG.warnAt?'warn':'';used+=u.used;tot+=u.max;if(c)near.push(g+' / '+v);
    rows+='<div class="hb cp"><span title="'+esc(g+' / '+v)+'">'+esc(g)+' <small>'+esc(v)+'</small></span><div class="bar '+c+'"><i style="width:'+Math.round(100*r)+'%"></i></div><b class="'+c+'">'+u.used+' / '+u.max+'</b></div>'})});
  var cd=new Date();cd.setDate(cd.getDate()-30);var cut=cd.getFullYear()+'-'+p2(cd.getMonth()+1)+'-'+p2(cd.getDate()),recent=act.filter(function(r){return isIso(r.date)&&r.date>=cut}).length,pct=tot?Math.round(100*used/tot):0;
  var k=[['Active records',act.length,'',trash+' in trash',''],['Capacity used',pct,'%',used+' of '+tot+' host numbers',''],['Added in last 30 days',recent,'','since '+cut,''],
    ['Ranges needing attention',near.length,'',near.length?esc(near.slice(0,2).join(', '))+(near.length>2?' +'+(near.length-2):''):'All ranges are healthy',near.some(function(n){return/FULL/.test(n)})?'':(near.length?'warn':'')]];
  var out='<div class="kpis">'+k.map(function(x){return'<div class="kpi '+x[4]+'"><small>'+x[0]+'</small><b data-n="'+x[1]+'" data-s="'+x[2]+'">'+x[1]+x[2]+'</b><small class="sub">'+x[3]+'</small></div>'}).join('')+'</div>';
  var capP='<div class="panel s2"><h2>Capacity by range</h2><small>Host numbers used per GCP &amp; Ring and vendor, including numbers reserved by deleted records. Orange from '+Math.round(CFG.warnAt*100)+'%, red when full.</small><div class="grow">'+rows+'</div></div>';
  if(!act.length)out+='<div class="dash2">'+capP+'<div class="panel empty"><h2>No records yet</h2><p><a href="generate.html">Create the first record</a> or import a sheet in the Worksheet page.</p></div></div>';
  else{
    var items=CFG.vendors.map(function(v){return[v,act.filter(function(r){return r.vendor===v}).length]});var oth=act.length-items.reduce(function(a,b){return a+b[1]},0);if(oth)items.push(['Other',oth]);
    var C=2*Math.PI*50,off=0,segs='',leg='';items.forEach(function(it,i){var len=C*it[1]/act.length;if(it[1]){segs+='<circle r="50" cx="70" cy="70" fill="none" stroke="'+COL[i]+'" stroke-width="22" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 70 70)"/>';off+=len}
      leg+='<li><i style="background:'+COL[i]+'"></i>'+esc(it[0])+' <b>'+it[1]+'</b> <small>'+Math.round(100*it[1]/act.length)+'%</small></li>'});
    var vP='<div class="panel"><h2>Records by vendor</h2><div class="grow center"><svg class="donut" viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="Records by vendor">'+segs+'<text class="dn" x="70" y="72" text-anchor="middle">'+act.length+'</text><text class="ds" x="70" y="90" text-anchor="middle">records</text></svg><ul class="leg">'+leg+'</ul></div></div>';
    var months=[],now=new Date();for(var i=5;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push([d.getFullYear()+'-'+p2(d.getMonth()+1),MON[d.getMonth()]])}
    var cnt={},dated=0;act.forEach(function(r){if(isIso(r.date)){var q=r.date.slice(0,7);cnt[q]=(cnt[q]||0)+1;dated++}});var mx=Math.max.apply(null,months.map(function(m){return cnt[m[0]]||0}).concat([1]));
    var mP='<div class="panel"><h2>Records per month</h2><small>Last 6 months, by record date</small><div class="cols grow">'+months.map(function(m){var n=cnt[m[0]]||0;return'<div><b>'+n+'</b><i style="height:'+Math.max(2,Math.round(100*n/mx*.78))+'%"></i>'+m[1]+'</div>'}).join('')+'</div></div>';
    var lg=S.log.slice(0,6),aP='<div class="panel s2"><h2>Recent activity</h2><ul class="act2" id="recent">'+(lg.map(function(l){return'<li><span class="t">'+esc(l.t)+'</span><span>'+esc(l.who)+'</span>'+chip(l.act)+'<code>'+esc(l.name)+'</code></li>'}).join('')||'<li>No activity yet.</li>')+'</ul><a class="more" href="management.html#log">Open the full change log</a></div>';
    out+='<div class="dash2">'+capP+vP+mP+aP+'</div>'}
  $('#dash').innerHTML=out;document.querySelectorAll('[data-n]').forEach(countUp)});
</script></body></html>
