<!doctype html>
<html lang="en" translate="no" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#124a2d">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<title>Dashboard - IP Generator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div class="pagehead">
    <div><h1>Dashboard</h1><p>Where can the next facility go, and how full is each range?</p></div>
    <div class="qa"><a class="btn primary" href="generate.html">+ New facility</a><a class="btn" href="worksheet.html">Open worksheet</a></div>
  </div>
  <div id="msg" class="msg"></div>
  <div id="dash"><div class="panel"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel" style="width:70%"></div></div></div>
</main>
<script src="js/config.js"></script><script src="js/engine.js"></script><script src="js/storage.js"></script><script src="js/common.js"></script>
<script>
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var VCOL = { Yokogawa: '#1e7145', Honeywell: '#84bd00', Other: '#a9b8ae' };

init('index').then(draw);

function draw() {
  var act = S.records.filter(function (r) { return !r.del; }), trash = S.records.length - act.length;
  var used = 0, tot = 0, attention = [], fullCount = 0;

  /* ----- address ranges: GCP & Ring x vendor ----- */
  var rows = Object.keys(CFG.gcps).map(function (g) {
    var o = CFG.gcps[g], vl = CFG.vlan[g];
    var cells = CFG.vendors.map(function (v) {
      var u = usage(g, v, S.records), r = u.used / u.max, full = u.used >= u.max, c = full ? 'full' : r >= CFG.warnAt ? 'warn' : '';
      used += u.used; tot += u.max;
      if (c) attention.push(g + ' / ' + v + (full ? ' (full)' : ''));
      if (full) fullCount++;
      var nx = full
        ? '<span class="full">Full: no free host numbers</span>'
        : 'Next: host ' + u.next + ' &rarr; RTU <code>' + esc(build(g, v, u.next)['RTU IP-1']) + '</code>';
      var inner = '<div class="bar ' + c + '"><i style="width:' + Math.round(100 * r) + '%"></i></div>' +
        '<span class="nums ' + c + '">' + u.used + ' / ' + u.max + ' <small>used</small></span><span class="nx">' + nx + '</span>';
      return '<td data-l="' + esc(v) + '">' + (full
        ? '<div class="cell">' + inner + '</div>'
        : '<a class="cell" href="generate.html?gcp=' + encodeURIComponent(g) + '&vendor=' + encodeURIComponent(v) + '" title="Create a facility in ' + esc(g + ' / ' + v) + '">' + inner + '</a>') + '</td>';
    }).join('');
    return '<tr><td class="rg"><b>' + esc(g) + '</b><small>' + o[0] + '.' + o[1] + '.x.x &middot; VLAN ' + esc(vl[0]) + ' / ' + esc(vl[1]) + '</small></td>' + cells + '</tr>';
  }).join('');

  var free = tot - used, pct = tot ? Math.round(100 * used / tot) : 0;
  var cd = new Date(); cd.setDate(cd.getDate() - 30);
  var cut = isoOf(cd), recent = act.filter(function (r) { return isIso(r.date) && r.date >= cut; }).length;

  var kpis = [
    ['Active facilities', act.length, '', trash ? trash + ' in trash (IPs still reserved)' : 'Nothing in the trash', ''],
    ['Free host numbers', free, '', pct + '% used (' + used + ' of ' + tot + ')', ''],
    ['Added in last 30 days', recent, '', 'since ' + cut, ''],
    ['Ranges needing attention', attention.length, '', attention.length ? attention.slice(0, 2).join(', ') + (attention.length > 2 ? ' +' + (attention.length - 2) : '') : 'All ranges are below ' + Math.round(CFG.warnAt * 100) + '%', fullCount ? 'full' : attention.length ? 'warn' : '']
  ];
  var out = '<div class="kpis">' + kpis.map(function (k) {
    return '<div class="kpi ' + k[4] + '"><small>' + k[0] + '</small><b data-n="' + k[1] + '" data-s="' + k[2] + '">' + k[1] + k[2] + '</b><small class="sub" title="' + esc(k[3]) + '">' + esc(k[3]) + '</small></div>';
  }).join('') + '</div>';

  var head = '<tr><th>GCP &amp; Ring</th>' + CFG.vendors.map(function (v) { return '<th>' + esc(v) + ' <span style="text-transform:none;font-weight:400">(' + CFG.max[v] + ' per ring)</span></th>'; }).join('') + '</tr>';
  var rangeP = '<section class="panel" aria-labelledby="hR"><div class="panel-h"><h2 id="hR">Address ranges</h2>' +
    '<div class="legend"><span><i style="background:var(--g)"></i>OK</span><span><i style="background:#d97706"></i>' + Math.round(CFG.warnAt * 100) + '% or more</span><span><i style="background:var(--bad)"></i>Full</span></div></div>' +
    '<div style="overflow-x:auto"><table class="matrix"><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div>' +
    '<small style="margin-top:8px">Used = host numbers taken by active records and by records in the trash. Click a range to create a facility in it.</small></section>';

  if (!act.length) {
    out += '<div class="dgrid">' + rangeP + '<section class="panel empty"><h2 style="justify-content:center">No records yet</h2><p>Create the first facility, or import an existing sheet.</p><div class="row" style="justify-content:center"><a class="btn primary" href="generate.html">+ New facility</a><a class="btn" href="worksheet.html">Import Excel</a></div></section></div>';
    $('#dash').innerHTML = out; $$('[data-n]').forEach(countUp); return;
  }

  /* ----- facilities by area, split by vendor ----- */
  var areas = CFG.facilities.slice(), byArea = {}, vendors = CFG.vendors.concat(['Other']), vt = {};
  act.forEach(function (r) {
    var a = String(r.name).split('-')[0].toUpperCase();
    if (areas.indexOf(a) < 0) a = 'Other';
    var v = CFG.vendors.indexOf(r.vendor) >= 0 ? r.vendor : 'Other';
    byArea[a] = byArea[a] || {}; byArea[a][v] = (byArea[a][v] || 0) + 1; vt[v] = (vt[v] || 0) + 1;
  });
  if (byArea.Other) areas.push('Other');
  var amax = Math.max.apply(null, areas.map(function (a) { var s = 0; for (var k in byArea[a] || {}) s += byArea[a][k]; return s; }).concat([1]));
  var fb = areas.map(function (a) {
    var d = byArea[a] || {}, n = 0; for (var k in d) n += d[k];
    var segs = vendors.filter(function (v) { return d[v]; }).map(function (v) { return '<i style="width:' + (100 * d[v] / amax) + '%;background:' + VCOL[v] + '" title="' + esc(v + ': ' + d[v]) + '"></i>'; }).join('');
    return '<div class="fb"><b>' + esc(a === 'Other' ? 'Other' : a) + '</b><div class="stack" role="img" aria-label="' + esc(a + ': ' + n + ' facilities') + '">' + segs + '</div><span class="n">' + n + '</span></div>';
  }).join('');
  var tots = vendors.filter(function (v) { return vt[v]; }).map(function (v) { return '<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:' + VCOL[v] + '"></i> ' + esc(v) + ' <b>' + vt[v] + '</b> <small>' + Math.round(100 * vt[v] / act.length) + '%</small></span>'; }).join('');
  var areaP = '<section class="panel" aria-labelledby="hA"><div class="panel-h"><h2 id="hA">Facilities by area</h2><small>Active records</small></div><div class="fbars">' + fb + '</div><div class="totals">' + tots + '</div></section>';

  /* ----- records per month ----- */
  var months = [], now = new Date();
  for (var i = 5; i >= 0; i--) { var d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push([d.getFullYear() + '-' + p2(d.getMonth() + 1), MON[d.getMonth()]]); }
  var cnt = {}; act.forEach(function (r) { if (isIso(r.date)) { var q = r.date.slice(0, 7); cnt[q] = (cnt[q] || 0) + 1; } });
  var mx = Math.max.apply(null, months.map(function (m) { return cnt[m[0]] || 0; }).concat([1]));
  var monthP = '<section class="panel" aria-labelledby="hM"><div class="panel-h"><h2 id="hM">New facilities per month</h2><small>Last 6 months</small></div><div class="cols grow" role="img" aria-label="New facilities per month">' +
    months.map(function (m, i) { var n = cnt[m[0]] || 0; return '<div' + (i === 5 ? ' class="cur"' : '') + '><b>' + n + '</b><i style="height:' + Math.max(2, Math.round(80 * n / mx)) + '%"></i>' + m[1] + '</div>'; }).join('') + '</div></section>';

  /* ----- recent activity ----- */
  var lg = S.log.slice(0, 5);
  var actP = '<section class="panel" aria-labelledby="hL"><div class="panel-h"><h2 id="hL">Recent activity</h2><a class="more" href="management.html#log">Open the full change log &rarr;</a></div><ul class="acts">' +
    (lg.map(function (l) { return '<li><span class="t">' + esc(l.t) + '</span><span class="w">' + esc(l.who) + '</span>' + chip(l.act) + '<code title="' + esc(l.det || '') + '">' + esc(l.name) + '</code></li>'; }).join('') || '<li>No activity yet.</li>') + '</ul></section>';

  out += '<div class="dgrid">' + rangeP + areaP + '</div><div class="dgrid b">' + monthP + actP + '</div>';
  $('#dash').innerHTML = out;
  $$('[data-n]').forEach(countUp);
}
</script>
</body>
</html>
